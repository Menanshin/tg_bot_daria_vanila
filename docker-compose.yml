services:
  bot:
    build: .
    container_name: attachment-quiz-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/bot.db
    volumes:
      - ./data:/app/data
      # Тексты можно править на сервере без пересборки: правка + docker compose restart
      - ./content:/app/content:ro
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"