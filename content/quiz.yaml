# Тест на тип привязанности.
# Две шкалы по 5 вопросов: anxiety (тревожность) и avoidance (избегание).
# reverse: true — балл переворачивается (1↔5, 2↔4), чтобы снизить влияние
# привычки «соглашаться со всем».
# Каждая шкала даёт 5..25 баллов. Порог «высокой» шкалы — threshold:
# сумма > threshold означает средний ответ выше нейтрального «3».

threshold: 15

scale:
  1: "Совсем не согласен(на)"
  2: "Скорее не согласен(на)"
  3: "Нейтрально / не знаю"
  4: "Скорее согласен(на)"
  5: "Полностью согласен(на)"

questions:
  - id: 1
    text: "Мне легко эмоционально сближаться с людьми."
    dimension: avoidance
    reverse: true
  - id: 2
    text: "Я часто боюсь, что партнёр любит меня меньше, чем я его."
    dimension: anxiety
    reverse: false
  - id: 3
    text: "Мне некомфортно делиться глубокими чувствами — даже с близкими."
    dimension: avoidance
    reverse: false
  - id: 4
    text: "Когда партнёр долго не отвечает, я начинаю тревожиться и додумывать худшее."
    dimension: anxiety
    reverse: false
  - id: 5
    text: "Когда партнёр становится слишком близко, мне хочется отстраниться."
    dimension: avoidance
    reverse: false
  - id: 6
    text: "Мне нужно, чтобы партнёр часто подтверждал, что я ему важен(на)."
    dimension: anxiety
    reverse: false
  - id: 7
    text: "Мне спокойнее, когда я ни от кого не завишу и никто не зависит от меня."
    dimension: avoidance
    reverse: false
  - id: 8
    text: "В трудную минуту мне легко опереться на партнёра."
    dimension: avoidance
    reverse: true
  - id: 9
    text: "Я часто переживаю, что меня могут оставить."
    dimension: anxiety
    reverse: false
  - id: 10
    text: "В отношениях я чувствую себя уверенно и редко боюсь, что меня бросят."
    dimension: anxiety
    reverse: true
