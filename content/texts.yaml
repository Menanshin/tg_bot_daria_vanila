# Раздел «Кто такая Дарья?». Кнопки под ним: запись, отзывы, подписаться на канал.
about: |
  <b>Кто такая Дарья? 👀</b>

  Мне 34, я живу на Пхукете и я дипломированный сексолог в психологическом консультировании.

  Но кроме диплома у меня за плечами большой жизненный опыт и годы личной терапии.

  Я знаю, что такое стыд, сложные периоды жизни и попытки заново разобраться в себе. И знаю, что к своим желаниям, телу и удовольствию можно вернуться, даже если когда-то казалось, что все окончательно пошло не туда.

  Поэтому со мной можно открыто говорить о сексе, фантазиях, фетишах и вещах, которые неловко обсуждать даже с близкими.

  <b>С чем ко мне приходят?</b>

  Когда пропало желание, сложно получать удовольствие или испытывать оргазм. Когда стыдно за свои фантазии, трудно почувствовать собственные границы или вообще понять, чего хочется.

  А иногда просто с ощущением: «Вроде все нормально, но что-то меня не устраивает».

  Я не оцениваю чужую сексуальную жизнь по шкале приличия. Мы разбираемся в твоем запросе, без осуждения и попыток подогнать тебя под чью-то норму.

  Консультации проходят онлайн, по видеосвязи, конфиденциально. Работаю со взрослыми от 18 лет.

  Если есть вопрос, который давно хочется задать — приходи. Необязательно заранее знать, с чего начать. 😏

