# Все тексты бота. Разметка — Telegram HTML (<b>, <i>, <a href="...">).
# ВАЖНО: перенос строки в тексте = перенос строки в Telegram.
# Абзац пиши одной строкой, между абзацами — пустая строка.
#
# Плейсхолдеры в фигурных скобках подставляет бот:
#   {channel}  — @username канала
#   {current} / {total} / {progress} / {text} — экран вопроса
#   {title} / {description} / {anxiety_bar} / {avoidance_bar} — экран гейта и результата

start: |
  <b>Узнай свой тип привязанности ❤️‍🔥</b>

  Это тест о том, как ты сближаешься с людьми, переживаешь расставания и ведёшь себя в близости. От этого во многом зависит, что происходит в твоих отношениях и в сексе.

  📝 10 утверждений, около 2 минут. Отвечай честно и не раздумывай долго — первый ответ обычно самый точный.

  <i>Это не диагноз, а способ лучше понять себя.</i>

start_button: "Пройти тест"

# Отправляется, если человек нажал /start, но так и не начал тест
# (через DIARY_DELAY_MINUTES минут). Подпись к PDF — до 1024 символов.
diary: |
  Кстати, я подготовила дневник самопознания с вопросами про твои желания. Если на «чего тебе хочется?» появляется ступор, то будет с чего начать. Забирай ниже ⬇️
diary_filename: "Дневник самопознания. Искусство желать.pdf"

# Показывается один раз после нажатия «Пройти тест», над вопросами.
scale_intro: |
  Оцени каждое утверждение по шкале от <b>1 до 5</b>:

  <b>1</b> — совсем не согласен(на)
  <b>2</b> — скорее не согласен(на)
  <b>3</b> — нейтрально / не знаю
  <b>4</b> — скорее согласен(на)
  <b>5</b> — полностью согласен(на)

question: |
  <b>Вопрос {current} из {total}</b>
  {progress}

  {text}

back_button: "← Назад"

calculating: "Считаю результат… ✨"

# Показывается сразу после теста, если человек ещё не подписан на канал.
gate: |
  <b>Твой результат: {title}</b>
  {description}

  <b>Твои шкалы</b>
  Тревожность: {anxiety_bar}
  Избегание: {avoidance_bar}

  🔒 <b>Полная расшифровка</b> — как твой тип проявляется в отношениях и в сексе и что с этим делать — доступна подписчикам канала сексолога Даши {channel}.

  Подпишись и нажми «Я подписался(ась)» 👇

subscribe_button: "📲 Подписаться на канал"
check_button: "✅ Я подписался(ась)"
not_subscribed: "Пока не вижу подписки 🙈 Подпишись на {channel} и нажми кнопку ещё раз."

# Полный результат: картинка типа, затем этот текст.
full_header: |
  <b>Твой результат: {title}</b>
  {description}

full_footer: |
  💡 <b>Важно помнить</b>
  • Никто не бывает «чисто» одним типом — у всех есть оттенки.
  • Тип привязанности меняется. Осознанность, тёплые отношения и работа со специалистом помогают прийти к надёжной привязанности.
  • Это не диагноз, а зеркало, которое помогает понять себя.

  Больше про привязанность, близость и сексуальность — в канале {channel} 💜

share_button: "📤 Поделиться тестом"
share_text: "Я узнал(а) свой тип привязанности. А какой у тебя? Пройди тест 👇"
restart_button: "🔄 Пройти ещё раз"
already_full: "Вот твой результат ещё раз 👇"

# Последнее сообщение после результата. Кнопка ведёт в личку Даши (CONTACT в .env)
# с готовым текстом «близость».
final_cta: |
  <b>Ну что, свой тип привязанности ты знаешь.</b>

  Знать свой тип, конечно, интересно. А понимать, как он влияет на твои отношения, близость и желания, гораздо полезнее.

  Пиши «близость» — разберём лично, как твой тип влияет на твою сексуальность.
final_cta_button: "Написать «близость»"
final_cta_message: "близость"

# Одно напоминание тем, кто увидел гейт, но не подписался.
reminder: |
  Привет! Ты прошёл(ла) тест и получил(а) результат «{title}», но так и не открыл(а) полную расшифровку 🙂

  Там — как твой тип проявляется в отношениях и в сексе и что с этим делать. Подпишись на {channel} и нажми кнопку ниже.

# Типы — как в исходной методике, без смешанных.
# title — название, description — короткое описание (видно и на гейте),
# full — расшифровка после подписки: «В сексе» и «Точка роста».
types:
  secure:
    title: "Безопасная привязанность 🌿"
    description: |
      Ты комфортно чувствуешь себя в близости, доверяешь, не боишься разлуки. Можешь быть рядом и — при этом — оставаться собой.
    full: |
      <b>В сексе</b>
      Обычно легче говорить о желаниях и границах, пробовать новое и не воспринимать отказ партнёра как отвержение. Секс — про удовольствие и контакт, а не про доказательство любви.

      <b>Точка роста</b>
      Безопасная привязанность не значит «без проблем». Обрати внимание на ситуации, где ты всё же начинаешь тревожиться или закрываться, — это подсказки, что для тебя важно. И помни, что партнёру с другим типом может быть сложнее, чем тебе: твоя устойчивость может стать для него опорой.

  anxious:
    title: "Тревожная привязанность 🔥"
    description: |
      Ты сильно нуждаешься в подтверждении любви, боишься одиночества, можешь быть эмоционально зависим(а). Часто переживаешь: <i>«Он(а) меня бросит?»</i>
    full: |
      <b>В сексе</b>
      Секс может становиться способом убедиться, что тебя любят. Отсюда сложности с отказом («если откажу — разлюбит»), с отказом партнёра («меня отвергают») и с тем, чтобы расслабиться и чувствовать своё удовольствие, а не следить за реакцией другого.

      <b>Точка роста</b>
      • Замечать момент, когда включается тревога, и называть её: «это мой страх, а не факт».
      • Говорить о потребностях напрямую: «мне важно, чтобы ты писал(а) днём» работает лучше проверок.
      • Находить опору не только в партнёре: друзья, тело, свои занятия.

  avoidant:
    title: "Избегающая привязанность 🧊"
    description: |
      Ты ценишь независимость, избегаешь глубоких чувств, не любишь делиться. Мысль <i>«Я сам(а) справлюсь»</i> — твой девиз.
    full: |
      <b>В сексе</b>
      Физическая близость может даваться проще, чем эмоциональная. Секс без разговоров — комфортно, а вот нежность «после», разговоры о желаниях и уязвимость могут вызывать дискомфорт.

      <b>Точка роста</b>
      • Замечать момент, когда хочется «сбежать», и пробовать остаться чуть дольше обычного.
      • Говорить партнёру о потребности в пространстве словами — это снимает напряжение у вас обоих.
      • Пробовать маленькие шаги уязвимости: поделиться одним чувством, попросить о чём-то одном.

  disorganized:
    title: "Дезорганизованная привязанность 🌪"
    description: |
      В тебе смешаны страх близости и жажда любви. Ты можешь то цепляться, то резко отстраняться. Часто связано с травматичным детством.
    full: |
      <b>В сексе</b>
      Желание и сближение могут сменяться отстранённостью или «отключением» прямо в процессе. Бывает сложно понять, чего ты на самом деле хочешь, и сказать об этом.

      <b>Точка роста</b>
      • Двигаться медленно: короткие шаги к близости и право на паузу.
      • Учиться замечать свои состояния в моменте: «сейчас мне хочется закрыться — что я чувствую?»
      • Этот тип хорошо поддаётся работе со специалистом — психологом или сексологом. Ты не «сломан(а)»: это выученная стратегия, и её можно менять.
