[project]
name = "attachment-quiz-bot"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках — это нормально

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
"bot/handlers.py" = ["S101"]
"bot/db.py" = ["S101"]
